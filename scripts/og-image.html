<!doctype html>
<!--
  공유 미리보기 그림(src/app/opengraph-image.png)의 원본.
  브라우저에서 1200×630 으로 열어 찍는다. 글꼴은 node_modules 의 Pretendard 를 읽으므로 `npm install` 뒤에 연다.
  문구를 고치면 다시 찍어 그림을 바꾼다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="../node_modules/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #ffffff;
        color: #16181d;
        font-family: "Pretendard Variable", sans-serif;
      }
      .glow i {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      .glow i:nth-child(1) {
        width: 720px;
        height: 720px;
        left: -220px;
        top: -260px;
        background: rgba(70, 136, 243, 0.42);
      }
      .glow i:nth-child(2) {
        width: 620px;
        height: 620px;
        right: -200px;
        top: 120px;
        background: rgba(164, 140, 239, 0.4);
      }
      .glow i:nth-child(3) {
        width: 300px;
        height: 300px;
        left: 520px;
        bottom: -120px;
        background: rgba(130, 207, 242, 0.45);
      }
      main {
        position: relative;
        height: 100%;
        box-sizing: border-box;
        padding: 80px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 40px;
        font-weight: 800;
      }
      .brand svg {
        width: 80px;
        height: 80px;
      }
      h1 {
        margin: 0;
        font-size: 84px;
        line-height: 1.18;
        letter-spacing: -3px;
        font-weight: 800;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(100deg, #1966f0 0%, #6a5ae0 55%, #1d84b5 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 28px 0 0;
        font-size: 34px;
        color: #58606e;
      }
    </style>
  </head>
  <body>
    <div class="glow"><i></i><i></i><i></i></div>
    <main>
      <div class="brand">
        <svg viewBox="0 0 1024 1024">
          <defs>
            <linearGradient id="gTile" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#F5F9FF" />
              <stop offset="1" stop-color="#E4EEFE" />
            </linearGradient>
          </defs>
          <rect x="24" y="24" width="976" height="976" rx="230" fill="url(#gTile)" />
          <defs>
            <linearGradient id="gBack" x1="0.85" y1="0" x2="0.15" y2="1">
              <stop offset="0" stop-color="#AECBFB" />
              <stop offset="1" stop-color="#82ACF6" />
            </linearGradient>
            <linearGradient id="gFront" x1="0.9" y1="0" x2="0.1" y2="1">
              <stop offset="0" stop-color="#9CC2FB" />
              <stop offset="0.55" stop-color="#4688F3" />
              <stop offset="1" stop-color="#356CE8" />
            </linearGradient>
            <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
              <rect width="1024" height="1024" fill="#fff" />
              <path
                d="M421.1 425.5 L698.9 350.5 C753.0 335.9 780.0 356.6 780.0 412.6 L780.0 584.6 C780.0 640.6 753.0 675.9 698.9 690.5 L421.1 765.5 C367.0 780.1 340.0 759.4 340.0 703.4 L340.0 531.4 C340.0 475.4 367.0 440.1 421.1 425.5 Z"
                fill="#000"
                stroke="#000"
                stroke-width="60"
                stroke-linejoin="round"
              />
            </mask>
            <mask id="pillCut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
              <rect width="1024" height="1024" fill="#fff" />
              <line
                x1="630.4000000000001"
                y1="626.992"
                x2="709.5999999999999"
                y2="605.608"
                stroke="#000"
                stroke-width="46"
                stroke-linecap="round"
              />
            </mask>
          </defs>
          <g transform="translate(512 512) scale(0.97) translate(-512 -512)">
            <path
              d="M325.1 333.5 L602.9 258.5 C657.0 243.9 684.0 264.6 684.0 320.6 L684.0 492.6 C684.0 548.6 657.0 583.9 602.9 598.5 L325.1 673.5 C271.0 688.1 244.0 667.4 244.0 611.4 L244.0 439.4 C244.0 383.4 271.0 348.1 325.1 333.5 Z"
              fill="url(#gBack)"
              mask="url(#gap)"
            />
            <path
              d="M421.1 425.5 L698.9 350.5 C753.0 335.9 780.0 356.6 780.0 412.6 L780.0 584.6 C780.0 640.6 753.0 675.9 698.9 690.5 L421.1 765.5 C367.0 780.1 340.0 759.4 340.0 703.4 L340.0 531.4 C340.0 475.4 367.0 440.1 421.1 425.5 Z"
              fill="url(#gFront)"
            />
            <line
              x1="630.4000000000001"
              y1="626.992"
              x2="709.5999999999999"
              y2="605.608"
              stroke="#FFFFFF"
              stroke-width="46"
              stroke-linecap="round"
            />
          </g>
        </svg>
        또링 가계부
      </div>
      <div>
        <h1>나 · 가족 · 여행,<br /><em>가계부 세 권</em>을 한 앱에서</h1>
        <p>광고 없이, 보여 주기만 하는 가계부</p>
      </div>
    </main>
  </body>
</html>
